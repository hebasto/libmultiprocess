name: CI

on:
  push:
  pull_request:

jobs:
  build-netbsd:
    runs-on: ubuntu-latest
    name: build • netbsd ${{ matrix.release }}
    defaults:
      run:
        shell: netbsd {0}
    strategy:
      fail-fast: false
      matrix:
        # Test all supported releases.
        # See https://www.netbsd.org/releases/.
        include:
          # Due to a bug in Cap'n Proto, GCC compilers older
          # than 14.x require `-DKJ_NO_EXCEPTIONS=0` when
          # processing `capnproto/c++/src/kj/common.h`.
          # See https://github.com/capnproto/capnproto/pull/2756/changes/28fa1a6753514d8de56875ec2222fa0e1c3a04f7.
          - release: '10.1'
            capnproto-cppflags: 'CPPFLAGS="-DKJ_NO_EXCEPTIONS=0"'
            env_vars: 'CXXFLAGS="-DKJ_NO_EXCEPTIONS=0"'
          - release: '11.0'
            capnproto-cppflags: 'CPPFLAGS="-DKJ_NO_EXCEPTIONS=0"'
            env_vars: 'CXXFLAGS="-DKJ_NO_EXCEPTIONS=0"'
    steps:
      - uses: actions/checkout@v7

      - name: Start NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          # The installed compiler version must match the CXX variable
          # defined in `ci/configs/netbsd.bash`.
          prepare: |
            pkg_add cmake ninja-build gcc14
          # capnproto prerequisites.
          # See the following "Install capnproto" step.
          run: |
            set -e
            pkg_add digest libtool-base mktools pkgconf cwrappers
            pkg_admin -K /usr/pkg/pkgdb fetch-pkg-vulnerabilities
            cd /usr
            cvs -danoncvs@anoncvs.NetBSD.org:/cvsroot checkout -P \
              pkgsrc/devel/capnproto \
              pkgsrc/devel/libtool-base \
              pkgsrc/devel/pkgconf \
              pkgsrc/devel/zlib \
              `# gcc16 is referenced here because the pkgsrc framework requires lang/gcc16/version.mk to exist` \
              `# during the "make install" step below, even though we compile our project with gcc14.` \
              pkgsrc/lang/gcc16 \
              pkgsrc/mk \
              pkgsrc/pkgtools \
              pkgsrc/security/openssl \
              pkgsrc/sysutils/install-sh/files
          sync: 'rsync'
          copyback: false

      - name: Install capnproto
        run: |
          cd /usr/pkgsrc/devel/capnproto/
          unset PKG_PATH
          make ${{ matrix.capnproto-cppflags }} install

      - name: Run CI script
        run: |
          cd ${{ github.workspace }}
          CI_CONFIG="ci/configs/netbsd.bash" ${{ matrix.env_vars }} bash ci/scripts/ci.sh

  build-openbsd:
    runs-on: ubuntu-latest
    name: build • openbsd
    defaults:
      run:
        shell: openbsd {0}
    steps:
      - uses: actions/checkout@v7

      - name: Start OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          prepare: |
            pkg_add -v cmake ninja bash capnproto
          sync: 'rsync'
          copyback: false

      - name: Run CI script
        run: |
          cd ${{ github.workspace }}
          CI_CONFIG="ci/configs/openbsd.bash" bash ci/scripts/ci.sh

  build-freebsd:
    runs-on: ubuntu-latest
    name: build • freebsd
    defaults:
      run:
        shell: freebsd {0}
    steps:
      - uses: actions/checkout@v7

      - name: Start FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          prepare: |
            pkg install -y cmake ninja bash capnproto git
          sync: 'rsync'
          copyback: false

      - name: Run CI script
        run: |
          cd ${{ github.workspace }}
          CI_CONFIG="ci/configs/freebsd.bash" bash ci/scripts/ci.sh

  build-openindiana:
    runs-on: ubuntu-latest
    name: build • openindiana
    defaults:
      run:
        shell: openindiana {0}
    steps:
      - uses: actions/checkout@v7

      - name: Start OpenIndiana VM
        uses: vmactions/openindiana-vm@v1
        with:
          # The "-build" image has metapackages/build-essential preinstalled,
          # which includes git, cmake and gcc.
          release: '202610-build'
          prepare: |
            pkg install ninja pkgconf
          sync: 'rsync'
          copyback: false

      - name: Run CI script
        run: |
          cd ${{ github.workspace }}
          CI_CONFIG="ci/configs/openindiana.bash" bash ci/scripts/ci.sh
